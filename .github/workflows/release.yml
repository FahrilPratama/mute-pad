name: Release MutePad

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Build MutePad (Universal Apple Silicon + Intel)
        run: |
          xcodebuild \
            -project MutePad.xcodeproj \
            -scheme MutePad \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package MutePad.zip and MutePad.dmg
        run: |
          mkdir -p dist dmg_stage
          APP_PATH="build/Build/Products/Release/MutePad.app"

          # Ad-hoc sign so Gatekeeper/local execution is consistent
          codesign --force --deep --sign - "$APP_PATH"

          # Create ZIP archive
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/MutePad.zip"

          # Create DMG image with Applications symlink
          cp -R "$APP_PATH" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create \
            -volname "MutePad" \
            -srcfolder dmg_stage \
            -ov \
            -format UDZO \
            "dist/MutePad.dmg"

          # Compute SHA256 checksums
          (cd dist && shasum -a 256 MutePad.zip MutePad.dmg > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MutePad.zip
            dist/MutePad.dmg
            dist/SHA256SUMS.txt
